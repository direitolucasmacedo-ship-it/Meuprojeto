<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#f5b623;--gold2:#ffd96a;--red:#e3262f;--bg:#120c07;--cream:#fff4dc}
body{width:1080px;height:var(--h);background:var(--bg);font-family:Montserrat,sans-serif;color:var(--cream);overflow:hidden}
.c{position:relative;width:1080px;height:var(--h);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:var(--pad) 70px;
 background:radial-gradient(ellipse 70% 45% at 50% 52%,rgba(245,182,35,.32),transparent 70%),radial-gradient(circle at 10% 0%,rgba(227,38,47,.28),transparent 40%),radial-gradient(circle at 100% 100%,rgba(227,38,47,.22),transparent 45%),var(--bg)}
.c:before{content:"";position:absolute;inset:22px;border:3px solid rgba(245,182,35,.55);border-radius:28px;pointer-events:none}
.pill{background:var(--red);color:#fff;font-weight:900;font-size:34px;letter-spacing:2px;padding:14px 34px;border-radius:999px;box-shadow:0 8px 24px rgba(227,38,47,.45);text-transform:uppercase}
h1{font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;text-align:center;line-height:1.02;color:#fff;font-size:var(--h1)}
h1 em{font-style:normal;color:var(--gold)}
.sub{font-size:var(--sub);font-weight:700;text-align:center;line-height:1.3;max-width:900px}
.sub b{color:var(--gold2)}
.tray{position:relative;width:var(--tray);height:var(--tray);border-radius:50%;background:radial-gradient(circle,#3a2412 0%,#24160b 60%,#1a1008 100%);box-shadow:0 0 0 12px rgba(245,182,35,.85),0 0 0 22px rgba(245,182,35,.18),0 30px 80px rgba(0,0,0,.6);display:grid;place-items:center}
.e{position:absolute;font-size:calc(var(--tray)*.2);filter:drop-shadow(0 10px 12px rgba(0,0,0,.55));line-height:1}
.center{font-size:calc(var(--tray)*.34)}
.foot{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%}
.price{display:flex;align-items:baseline;gap:22px;font-weight:800}
.price s{font-size:38px;opacity:.65}
.price span{font-family:Anton,sans-serif;font-size:96px;color:var(--gold);font-weight:400;line-height:1}
.cta{background:linear-gradient(180deg,#ff3a43,#c81820);color:#fff;font-weight:900;font-size:40px;padding:24px 60px;border-radius:18px;text-transform:uppercase;box-shadow:0 10px 0 #7d0c12,0 18px 30px rgba(0,0,0,.5);letter-spacing:1px}
.mini{font-size:28px;font-weight:700;opacity:.85}
.big650{font-family:Anton,sans-serif;font-size:var(--n);line-height:.9;color:var(--gold);text-shadow:0 8px 0 #8a5a00,0 20px 50px rgba(245,182,35,.35)}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:14px;max-width:960px}
.chip{background:rgba(255,244,220,.08);border:2px solid rgba(245,182,35,.6);padding:10px 22px;border-radius:999px;font-weight:800;font-size:var(--chip)}
.bonus{background:var(--gold);color:#1a1008;font-weight:900;font-size:32px;padding:14px 30px;border-radius:14px;transform:rotate(-2deg)}
</style></head><body><div class="c">__BODY__</div></body></html>
